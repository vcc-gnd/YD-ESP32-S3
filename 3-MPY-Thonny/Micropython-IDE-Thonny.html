</head>
<body>
<form name=loading> 
　<p align=center> <font color="#0066ff" size="2">Please wait. The destination webpage and its resources are provided by a third party. This website is not responsible for them.</font><font color="#0066ff" size="2" face="Arial">...</font>
　　<input type=text name=chart size=46 style="font-family:Arial; font-weight:bolder; color:#0066ff; background-color:#fef4d9; padding:0px; border-style:none;"> 
　　<input type=text name=percent size=47 style="color:#0066ff; text-align:center; border-width:medium; border-style:none;"> 
　　<script>　 
var bar=0　
var line="||"　
var amount="||"　
count()　 
function count(){　 
bar=bar+2　 
amount =amount + line　 
document.loading.chart.value=amount
document.loading.percent.value=bar+"%"　
if (bar<99)　 
{setTimeout("count()",10);}
else　 
{window.location = "https://thonny.org/";}
}</script> 
　</p> 
</form> 
<p align="center">If your browser does not redirect automatically, <a style="text-decoration: none"https://thonny.org/"><font color="#FF0000">click here</font></a>.</p>
